          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'

      - name: Is sprout affected by this push?
        id: affected
        if: steps.gate.outputs.ready == 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: |
          if pnpm exec turbo ls --affected --output=json | jq -e '.packages.items[] | select(.name == "sprout")' > /dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::sprout not affected by this push — skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.affected.outputs.deploy == 'true'

      - name: Deploy sprout (release_command runs migrations)
        if: steps.affected.outputs.deploy == 'true'
        # From the repo root: the Dockerfile needs the whole monorepo as its
        # build context (turbo prune).
        run: flyctl deploy --config apps/sprout/fly.toml --remote-only

      # SMOKE CONSTRAINT (ADR-0011 item 4): smoke URLs must stay on
      # hoe-sprout.fly.dev and touch only geo-exempt paths (/health, /terms,
      # /privacy). The UK geo boundary refuses everything else with 451 —
      # direct .fly.dev requests carry no CF-IPCountry header (fail-closed) —
      # so the former SPA-index/asset checks cannot pass from a US runner and
      # were removed by design. The final check asserts the refusal itself:
      # the load-bearing boundary is live on the deployed app.
      - name: Post-deploy smoke
        if: steps.affected.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          echo "deep /health (real Store → Postgres round-trip)"
          curl -fsS --retry 5 --retry-delay 3 "$APP_URL/health"
          echo "geo-exempt legal documents"
          curl -fsS "$APP_URL/terms" > /dev/null
          curl -fsS "$APP_URL/privacy" > /dev/null
          echo "geo boundary refuses headerless non-exempt traffic (451)"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/")
          test "$code" = "451"
          echo "smoke OK"

  # sprout-pipeline — headless, PRIVATE safety service (plan 0004 §5.5 / §9.3).
  # No public hostname, so there is NO public /health to curl. The deploy step
  # is itself the smoke: the machine only becomes healthy if index.ts boots, and
  # index.ts fails closed at boot without OPENROUTER_API_KEY (client
  # construction) and PIPELINE_API_KEY (prod guard) — a bad release aborts the
  # rollout. (node:22-slim ships no curl, so an in-container HTTP probe isn't
  # available either; `flyctl status` prints the machine health for the log.)
  #
  # NOTE (P11): ORG-scoped FLY_API_TOKEN required (same as sprout). Do NOT add a
  # Cloudflare CNAME/cert for this app — it stays private (.flycast).
  deploy-sprout-pipeline:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on go-live (P11) + deploy token
        id: gate
        env:
          GO_LIVE: ${{ vars.SPROUT_GO_LIVE }}
        run: |
          if [ "$GO_LIVE" != "true" ]; then
            echo "::notice::sprout not live yet — set repo variable SPROUT_GO_LIVE=true at go-live (P11, runbook step 4)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$FLY_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FLY_API_TOKEN not set — deploy workflow is inert until Phase 4 (runbook G4.2)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'

      - name: Is sprout-pipeline affected by this push?
        id: affected
        if: steps.gate.outputs.ready == 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: |
          if pnpm exec turbo ls --affected --output=json | jq -e '.packages.items[] | select(.name == "sprout-pipeline")' > /dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::sprout-pipeline not affected by this push — skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.affected.outputs.deploy == 'true'

      - name: Deploy sprout-pipeline (no release_command — stateless)
        if: steps.affected.outputs.deploy == 'true'
        # From the repo root: the Dockerfile needs the whole monorepo as its
        # build context (turbo prune).
        run: flyctl deploy --config apps/sprout-pipeline/fly.toml --remote-only

      - name: Post-deploy status (no public smoke — private .flycast service)
        if: steps.affected.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          echo "sprout-pipeline is private (no public hostname) — the deploy above"
          echo "gates the rollout on the machine booting healthy. Machine status:"
          flyctl status --config apps/sprout-pipeline/fly.toml

  # Records what actually shipped, so the homepage's New / Updated pills follow
  # real deploys instead of somebody remembering to edit a date by hand.
  # Spec: .scratch/automatic-homepage-labels/spec.md.
  #
  # One collector rather than a step inside each deploy job: the deploy-* jobs
  # run in parallel, and a shared-package change makes every app affected, so
  # ten jobs racing to push to main is ten rejected pushes.
  #
  # Not in `needs`: deploy-sprout and deploy-sprout-pipeline. They are gated on
  # SPROUT_GO_LIVE and neither has a homepage card, so waiting on them would buy
  # nothing. deploy-hub IS in `needs` — not because hub has a card on its own
  # homepage (it doesn't), but so this job's hub deploy cannot race that one.
  record-deploys:
    runs-on: ubuntu-latest
    needs:
      [
        deploy-hub,
        deploy-boids,
        deploy-espy,
        deploy-karesansui,
        deploy-boop,
        deploy-silt,
        deploy-fridge,
        deploy-wotd,
      ]
    # One app failing to deploy must not stop the apps that succeeded from being
    # recorded — the per-app check below is what decides, not the overall run.
    if: always()
    permissions:
      contents: write
      # The record lands through a PR now that main requires status checks
      # (ADR 0047): pull-requests to open it, actions to dispatch its checks.
      pull-requests: write
      actions: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://hoe-hub.fly.dev
    steps:
      - uses: actions/checkout@v4
        with:
          # main, not the triggering commit: another deploy may have landed
          # while this run was building. fetch-depth 0 so the rebase-on-reject
          # below has real history to work with.
          ref: main
          fetch-depth: 0

      - name: Gate on deploy token (inert until Phase 4)
        id: gate
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FLY_API_TOKEN not set — deploy workflow is inert until Phase 4 (runbook G4.2)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc

      # No pnpm install: the recorder is dependency-free and runs under Node 22
      # type-stripping, the same way apps/hub's `start` script runs its server.
      - name: Record the deploys that actually shipped
        id: record
        if: steps.gate.outputs.ready == 'true'
        env:
          # An app shipped only when its job succeeded AND it was affected — a
          # skipped app's job is "success" too, so `result` alone would record
          # every app on every push.
          BOIDS: ${{ needs.deploy-boids.result == 'success' && needs.deploy-boids.outputs.deployed == 'true' }}
          ESPY: ${{ needs.deploy-espy.result == 'success' && needs.deploy-espy.outputs.deployed == 'true' }}
          KARESANSUI: ${{ needs.deploy-karesansui.result == 'success' && needs.deploy-karesansui.outputs.deployed == 'true' }}
          BOOP: ${{ needs.deploy-boop.result == 'success' && needs.deploy-boop.outputs.deployed == 'true' }}
          SILT: ${{ needs.deploy-silt.result == 'success' && needs.deploy-silt.outputs.deployed == 'true' }}
          FRIDGE: ${{ needs.deploy-fridge.result == 'success' && needs.deploy-fridge.outputs.deployed == 'true' }}
          WOTD: ${{ needs.deploy-wotd.result == 'success' && needs.deploy-wotd.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          # A record may still be waiting in an unmerged deploy-record PR; start
          # from that branch's file so this run accumulates onto it instead of
          # clobbering it.
          if git fetch origin deploy-record; then
            git checkout FETCH_HEAD -- apps/hub/src/generated/deployments.json
          fi
          apps=""
          add() { if [ "$2" = "true" ]; then apps="$apps $1"; fi; }
          add boids "$BOIDS"
          add boop "$BOOP"
          add espy "$ESPY"
          add fridge "$FRIDGE"
          add karesansui "$KARESANSUI"
          add silt "$SILT"
          add wotd "$WOTD"
          # $apps is deliberately unquoted — it is a list of app names.
          node apps/hub/src/deployments/recordDeploys.ts --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" $apps
          # Diffed against HEAD (main), not the index: a carry-forward staged by
          # the checkout above must count as changed, so a stalled record PR is
          # re-armed by the next deploy instead of waiting on new content.
          if git diff --quiet HEAD -- apps/hub/src/generated/deployments.json; then
            echo "::notice::no homepage app deployed in this push — nothing to record."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "apps=${apps# }" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Main is protected (required checks), so the record cannot be pushed to
      # it directly. It lands through a short-lived PR instead (ADR 0047):
      # commit on `deploy-record`, open or refresh the PR, arm auto-merge, and
      # dispatch the PR checks onto the branch ourselves - a branch pushed with
      # GITHUB_TOKEN raises no pull_request event (GitHub suppresses that
      # token's events to stop workflow recursion; workflow_dispatch is the
      # documented exception, which is exactly the loophole used here).
      # Recursion safety no longer hangs on the token: the merge commit touches
      # only deployments.json, which this workflow's paths-ignore skips, and
      # `[skip ci]` in the message is a second, independent lock.
      - name: Land the record through a PR (main is protected)
        if: steps.record.outputs.changed == 'true'
        env:
          APPS: ${{ steps.record.outputs.apps }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy-record
          git add apps/hub/src/generated/deployments.json
          git commit -m "chore: record deploys (${APPS:-carry-forward}) [skip ci]"
          # Always exactly one commit ahead of main. Any pending record was
          # carried into the file before the recorder ran, so the force push
          # rewrites nothing but history this job itself wrote.
          git push --force origin deploy-record
          pr=$(gh pr list --head deploy-record --base main --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --head deploy-record --base main \
              --title "chore: record deploys (${APPS:-carry-forward}) [skip ci]" \
              --body "Generated by the record-deploys job: the homepage deploy record for the apps that shipped. Lands via PR because main requires status checks - see ADR 0047. The site is already fresh (hub was redeployed by the same job); this PR only makes git agree.")
            pr=${url##*/}
          fi
          if [ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest == null')" = "true" ]; then
            gh pr merge "$pr" --squash --auto
          fi
          # The force push raised no pull_request event (GITHUB_TOKEN), so put
          # the required checks onto the branch head explicitly.
          gh workflow run pr.yml --ref deploy-record

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.record.outputs.changed == 'true'

      - name: Redeploy hub so the recorded dates reach the browser
        if: steps.record.outputs.changed == 'true'
        # Load-bearing. The record reaches main through the PR above minutes
        # from now, and that merge is deliberately invisible to this workflow
        # (paths-ignore), so nothing else will rebuild hub - without this the
        # dates are correct in git and stale on the site, which looks like the
        # feature working right up until you check. Deployed from this job's
        # working tree, which already holds the new record - no need to wait
        # for the PR. When hub was itself in the push this is its second
        # deploy of the run: two minutes of remote build, cheaper than a
        # conditional that could get the ordering wrong.
        run: flyctl deploy --config apps/hub/fly.toml --remote-only

      - name: Post-deploy smoke
        if: steps.record.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "deep /health (real Store → Postgres round-trip)"
          curl -fsS --retry 5 --retry-delay 3 "$APP_URL/health"
          echo "SPA index"
          index=$(curl -fsS "$APP_URL/")
          echo "$index" | grep -q '<div id="root">'
          echo "one hashed static asset"
          asset=$(echo "$index" | grep -oE 'assets/[^"]+\.js' | head -1)
          test -n "$asset"
          curl -fsS "$APP_URL/$asset" > /dev/null
          echo "smoke OK"

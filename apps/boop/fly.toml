# boop — kid-friendly 6x16 step-sequencer music toy (ADR 0008, stateless).
#
# A stateless app (ADR 0008) has NO release_command (no migrations) and a shallow
# /health. If the app gains a database, add both back — see apps/hub/fly.toml for
# the release_command and the deep-health check.
app = 'hoe-boop'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Scale to zero when idle — a copied app raises this if it must stay warm.
  min_machines_running = 0

  [[http_service.checks]]
    # Shallow health: liveness only — boop has no Store to round-trip (ADR 0008).
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

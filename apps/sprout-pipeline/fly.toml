# sprout-pipeline — the headless LLM safety service (plan 0004 §5.5 / §9.1, D7).
# Deploy FROM THE REPO ROOT so the docker build context contains the whole
# monorepo:
#
#   fly deploy -c apps/sprout-pipeline/fly.toml
#
# PRIVATE-ONLY app: it is reached by hoe-sprout over Fly's private network
# (hoe-sprout-pipeline.flycast:8080), never from the public internet, and gets
# NO Cloudflare CNAME / cert (plan §3, §9.3, §10 — LLM keys live only here).
# Flycast = Fly Proxy over the private network, so it needs BOTH a PRIVATE
# IPv6 allocation (`fly ips allocate-v6 --private`, go-live note 1 below) AND
# the [http_service] block for the proxy to route to port 8080. Privacy comes
# from the app holding ONLY that private IP — never allocate a public one.
# Stateless (no database), so there is NO [deploy] release_command.
app = 'hoe-sprout-pipeline'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

# Routes flycast (private) traffic only — the app holds no public IP, so the
# Fly Proxy never serves this from the public internet. A [[services]] block
# rather than the [http_service] shorthand: the shorthand pins the proxy's
# listen ports to 80/443, but every caller (main.ts's PIPELINE_URL default,
# the docker stack, the docs) expects hoe-sprout-pipeline.flycast:8080, so
# the proxy must listen on 8080. Plain http handler — flycast traffic never
# leaves the 6PN. Machines never auto-stop, so the endpoint stays warm.
[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8080
    handlers = ['http']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# ─────────────────────────────────────────────────────────────────────────────
# HUMAN GO-LIVE NOTES (P11 — plan §9.3 / §10). An agent must NOT run these.
#
# 1. NO PUBLIC HOSTNAME. Do NOT run `scripts/go-live.sh`'s CNAME/cert flow for
#    this app, and do NOT allocate any PUBLIC IP. It must remain private, which
#    for .flycast means allocating the PRIVATE IPv6 — and doing it BEFORE the
#    first deploy with [http_service], or `fly deploy` auto-allocates public
#    IPs when it sees a service and no IPs at all:
#        fly ips allocate-v6 --private --app hoe-sprout-pipeline
#    Verify after deploy: `fly ips list --app hoe-sprout-pipeline` shows ONLY
#    the private address. The CNAME/cert flow applies ONLY to hoe-sprout.
#
# 2. ORG-SCOPED DEPLOY TOKEN. Same as hoe-sprout: the app-scoped hoe-hub
#    FLY_API_TOKEN cannot deploy this app — an ORG-scoped token is required.
#
# 3. SECRETS (set on THIS app, hoe-sprout-pipeline):
#        fly secrets set --app hoe-sprout-pipeline \
#          OPENROUTER_API_KEY=…  PIPELINE_API_KEY=…
#    - OPENROUTER_API_KEY lives ONLY here (the LLM key — secret isolation, the
#      reason this is a separate app). index.ts constructs the OpenAI client at
#      boot and will crash without it.
#    - PIPELINE_API_KEY is the shared service-to-service key; set the SAME value
#      on hoe-sprout (the caller sends it as x-pipeline-key). index.ts refuses
#      to start in prod without it.
#
# 4. PRIVATE NETWORKING. Confirm hoe-sprout reaches hoe-sprout-pipeline.flycast
#    (same Fly org / 6PN). No firewall/allowlist config needed beyond that.
# ─────────────────────────────────────────────────────────────────────────────
